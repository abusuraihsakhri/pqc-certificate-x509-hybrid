version: '3.8'

services:
  pqc-certificate-x509-hybrid:
    build: .
    container_name: pqc-certificate-x509-hybrid
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=pqc-certificate-x509-hybrid-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
