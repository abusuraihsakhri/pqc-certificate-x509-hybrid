[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-certificate-x509-hybrid"
version = "2.0.0"
description = "PQC-X509: Hybrid Post-Quantum PKI Certificate Parser & Authority Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pqc-certificate-x509-hybrid = "pqc_x509_pki.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/pqc-certificate-x509-hybrid"
Repository = "https://github.com/abusuraihsakhri/pqc-certificate-x509-hybrid.git"
