name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Check dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents pqc_x509_pki cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Test browser-side logic
        run: node --test web/app.test.cjs
      - name: Check browser-side syntax
        run: node --check web/app.js
